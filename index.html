<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中越通跨境代购 ERP 运营系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shadow-xl z-10 flex-shrink-0">
        <div>
            <div class="p-5 flex items-center gap-3 border-b border-slate-800">
                <div class="bg-gradient-to-br from-red-600 to-amber-500 text-white p-2 rounded-xl font-black tracking-wider text-xs shadow-md">
                    CN 🇻🇳 VN
                </div>
                <div>
                    <h1 class="font-bold text-white tracking-wide text-sm flex items-center gap-1">
                        中越通代购 ERP
                    </h1>
                    <span class="text-[10px] text-slate-500 block">Sino-Viet Express ERP</span>
                </div>
            </div>
            
            <nav class="p-4 space-y-1" id="sidebar-menu">
                <a href="#dashboard" data-target="dashboard" class="menu-item active flex items-center gap-3 px-4 py-3 rounded-xl transition text-xs font-semibold">
                    <i class="fa-solid fa-chart-pie w-5 text-sm"></i> 仪表盘 Dashboard
                </a>
                <a href="#orders" data-target="orders" class="menu-item flex items-center gap-3 px-4 py-3 rounded-xl transition text-xs font-semibold">
                    <i class="fa-solid fa-file-invoice-dollar w-5 text-sm"></i> 订单管理 Order Mgmt
                </a>
                <a href="#customers" data-target="customers" class="menu-item flex items-center gap-3 px-4 py-3 rounded-xl transition text-xs font-semibold">
                    <i class="fa-solid fa-users w-5 text-sm"></i> 客户管理 Customer Mgmt
                </a>
                <a href="#warehouse" data-target="warehouse" class="menu-item flex items-center gap-3 px-4 py-3 rounded-xl transition text-xs font-semibold">
                    <i class="fa-solid fa-warehouse w-5 text-sm"></i> 包裹/集运仓 Warehouse
                </a>
                <a href="#finance" data-target="finance" class="menu-item flex items-center gap-3 px-4 py-3 rounded-xl transition text-xs font-semibold">
                    <i class="fa-solid fa-wallet w-5 text-sm"></i> 财务管理 Finance
                </a>
                <a href="#system" data-target="system" class="menu-item flex items-center gap-3 px-4 py-3 rounded-xl transition text-xs font-semibold">
                    <i class="fa-solid fa-gears w-5 text-sm"></i> 系统设置 Settings
                </a>
            </nav>
        </div>
        
        </aside>

    <div class="flex-grow flex flex-col min-w-0 overflow-hidden">
        <header class="bg-white h-16 border-b border-slate-200 flex items-center justify-between px-8 shadow-sm flex-shrink-0">
            <div class="flex items-center gap-4">
                <span id="page-title" class="text-base font-bold text-slate-800">仪表盘 Dashboard</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="relative cursor-pointer group">
                    <i class="fa-regular fa-bell text-lg text-slate-400 group-hover:text-slate-600 transition"></i>
                    <span class="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 bg-rose-500 rounded-full"></span>
                </div>
                <div class="h-6 w-px bg-slate-200"></div>
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                        AD
                    </div>
                    <span class="text-xs font-semibold text-slate-700">管理员 (越南线)</span>
                    <i class="fa-solid fa-angle-down text-[10px] text-slate-400"></i>
                </div>
            </div>
        </header>

        <main class="flex-grow p-8 overflow-y-auto" id="main-view">
            <div class="flex items-center justify-center h-full">
                <i class="fa-solid fa-circle-notch animate-spin text-xl text-indigo-600"></i>
            </div>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
    <script src="js/orders.js"></script>
    <script src="js/customers.js"></script>
    <script src="js/warehouse.js"></script>
    <script src="js/finance.js"></script>
    <script src="js/system.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
